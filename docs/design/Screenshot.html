<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настроить по скриншоту</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&amp;family=Golos+Text:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e141b;font-family:'Golos Text',system-ui,sans-serif;color:#e6edf3;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #3fb4ff;outline-offset:2px}
.sel{appearance:none;-webkit-appearance:none;width:100%;box-sizing:border-box;background:#121820;border:1px solid #2e3b4b;border-radius:8px;color:#e6edf3;padding:9px 30px 9px 12px;font:inherit;font-size:14px}
</style>
</head>
<body>
<div style="width: 640px; height: 660px; display: flex; flex-direction: column; background: #171d25; overflow: hidden">
<div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; background: #0b1016; border-bottom: 1px solid #1c252f">
<span style="font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 14px">Настроить зоны по скриншоту</span>
<button type="button" aria-label="Закрыть" style="width: 40px; height: 32px; border: 0; background: transparent; color: #9fb0c2; border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="flex-grow: 1; box-sizing: border-box; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 8px">
<label for="shot" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Файл скриншота</label>
<input id="shot" type="text" readonly value="C:\Users\Stas\Pictures\cyberpunk_judy.jpg" style="flex-grow: 1; box-sizing: border-box; height: 38px; padding: 0 12px; background: #121820; border: 1px solid #2e3b4b; border-radius: 8px; color: #cfd9e3; font-family: 'JetBrains Mono', monospace; font-size: 12px">
<button type="button" style="height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid #2e3b4b; background: #263241; color: #e6edf3; font-size: 13px">Выбрать…</button>
</div>
<div aria-label="Превью скриншота" style="position: relative; height: 262px; border-radius: 10px; overflow: hidden; border: 1px solid #263241; background: linear-gradient(180deg, #121829 0%, #221a36 50%, #3a2140 78%, #1a1220 100%)">
<div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 80px; height: 170px; background: #0b0f18"></div>
<div aria-hidden="true" style="position: absolute; left: 110px; bottom: 0; width: 90px; height: 200px; background: #090d15"></div>
<div aria-hidden="true" style="position: absolute; left: 250px; bottom: 0; width: 110px; height: 110px; background: #0a0e17"></div>
<div aria-hidden="true" style="position: absolute; left: 355px; bottom: 0; width: 70px; height: 185px; background: #0c111c"></div>
<div aria-hidden="true" style="position: absolute; left: 500px; bottom: 0; width: 92px; height: 210px; background: #0d1220"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 222px; width: 100%; text-align: center; font-size: 11px; font-weight: 500; text-shadow: 0 1px 2px #000000"><span style="color: #ff8a5c">Джуди: </span><span style="color: #9ef3ff">Ви, ты вообще меня слушаешь?</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #1b2e25; border: 1px solid #2c5a41">
<svg style="flex-shrink: 0; color: #8fe0ad" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
<span style="font-size: 13px; color: #d5f2e0">2560×1440 — полный кадр, раскладка <b>16:9</b></span>
</div>
<div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #33291a; border: 1px solid #6b5426">
<svg style="flex-shrink: 0; margin-top: 1px; color: #f0c674" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>
<span style="font-size: 13px; line-height: 1.45; color: #f6e6c4">JPEG: цвета могут немного отличаться от игры. Зоны настроятся точно, а цвета лучше потом проверить в игре.</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="prof" style="font-size: 13px; color: #9fb0c2">Для какой игры</label>
<div style="position: relative"><select id="prof" class="sel"><option>Cyberpunk 2077</option><option>Grand Theft Auto V</option><option>The Witcher 3</option></select><svg style="position: absolute; right: 10px; top: 50%; margin-top: -8px; pointer-events: none; color: #7d8fa3" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></div>
</div>
<div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px">
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #2e3b4b; background: transparent; color: #cfd9e3; font-size: 14px">Отмена</button>
<button type="button" style="height: 40px; padding: 0 18px; border-radius: 8px; border: 0; background: #3fb4ff; color: #0b1520; font-size: 14px; font-weight: 600">Открыть редактор</button>
</div>
</div>
</div>
</body>
</html>
